<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мальчик или девочка? 💫</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink: #e8587a;
    --pink-light: #fce8ee;
    --pink-mid: #f4a8bc;
    --blue: #4d83d5;
    --blue-light: #e4edf9;
    --blue-mid: #95b8ea;
    --gold: #c9a96e;
    --cream: #fdf8f4;
    --dark: #2a1a2e;
    --text-muted: #8a7a8e;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── PARTICLES ── */
  #particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) scale(1); opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.3; }
    100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
  }

  /* ── HERO ── */
  .hero {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 5rem 1.5rem 3rem;
  }

  .hero-eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1.2rem;
    opacity: 0;
    animation: fadeDown 0.8s ease forwards 0.2s;
  }

  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3rem, 8vw, 5.5rem);
    font-weight: 300;
    line-height: 1.05;
    color: var(--dark);
    margin-bottom: 0.6rem;
    opacity: 0;
    animation: fadeDown 0.8s ease forwards 0.4s;
  }
  .hero-title em {
    font-style: italic;
    color: var(--pink);
  }

  .hero-sub {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.25rem;
    font-weight: 300;
    color: var(--text-muted);
    margin-bottom: 3rem;
    opacity: 0;
    animation: fadeDown 0.8s ease forwards 0.6s;
  }

  /* ornament */
  .ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 3rem;
    opacity: 0;
    animation: fadeDown 0.8s ease forwards 0.8s;
  }
  .ornament-line {
    height: 0.5px;
    width: 60px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .ornament-line.r { background: linear-gradient(90deg, var(--gold), transparent); }
  .ornament-diamond {
    width: 7px; height: 7px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── VOTE CARDS ── */
  .vote-section {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    flex-wrap: wrap;
    padding: 0 1.5rem 3rem;
    opacity: 0;
    animation: fadeDown 0.9s ease forwards 1s;
  }

  .vote-card {
    flex: 1;
    min-width: 220px;
    max-width: 300px;
    border-radius: 24px;
    padding: 2.5rem 1.8rem 2rem;
    text-align: center;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    position: relative;
    overflow: hidden;
    user-select: none;
  }

  .vote-card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.3s;
    border-radius: inherit;
  }

  .vote-card:hover { transform: translateY(-6px); }
  .vote-card:active { transform: scale(0.97); }

  .card-girl {
    background: var(--pink-light);
    border-color: var(--pink-mid);
  }
  .card-girl::before { background: radial-gradient(circle at 50% 0%, rgba(232,88,122,0.12), transparent 70%); }
  .card-girl:hover::before { opacity: 1; }
  .card-girl:hover { box-shadow: 0 20px 60px rgba(232,88,122,0.2); border-color: var(--pink); }

  .card-boy {
    background: var(--blue-light);
    border-color: var(--blue-mid);
  }
  .card-boy::before { background: radial-gradient(circle at 50% 0%, rgba(77,131,213,0.12), transparent 70%); }
  .card-boy:hover::before { opacity: 1; }
  .card-boy:hover { box-shadow: 0 20px 60px rgba(77,131,213,0.2); border-color: var(--blue); }

  .card-voted-girl { border-color: var(--pink) !important; box-shadow: 0 0 0 3px rgba(232,88,122,0.2); }
  .card-voted-boy  { border-color: var(--blue) !important; box-shadow: 0 0 0 3px rgba(77,131,213,0.2); }

  .card-icon {
    font-size: 56px;
    line-height: 1;
    margin-bottom: 1rem;
    display: block;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.1));
    transition: transform 0.3s ease;
  }
  .vote-card:hover .card-icon { transform: scale(1.12) rotate(-3deg); }

  .card-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 600;
    margin-bottom: 0.3rem;
    display: block;
  }
  .card-girl .card-label { color: var(--pink); }
  .card-boy  .card-label { color: var(--blue); }

  .card-sub {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 1.5rem;
  }

  .vote-btn {
    display: inline-block;
    padding: 10px 28px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1px;
    border: 1.5px solid;
    cursor: pointer;
    background: transparent;
    transition: background 0.2s, color 0.2s, transform 0.15s;
  }
  .card-girl .vote-btn { color: var(--pink); border-color: var(--pink); }
  .card-girl .vote-btn:hover { background: var(--pink); color: white; }
  .card-boy  .vote-btn { color: var(--blue); border-color: var(--blue); }
  .card-boy  .vote-btn:hover { background: var(--blue); color: white; }

  /* ── RESULTS ── */
  .results-section {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto 4rem;
    padding: 0 1.5rem;
    opacity: 0;
    animation: fadeDown 0.9s ease forwards 1.2s;
  }

  .results-title {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    font-weight: 300;
    color: var(--text-muted);
    margin-bottom: 1.5rem;
    letter-spacing: 1px;
  }

  .results-bar-wrap {
    background: white;
    border-radius: 20px;
    padding: 1.8rem 2rem;
    border: 1px solid rgba(0,0,0,0.06);
    box-shadow: 0 4px 30px rgba(0,0,0,0.04);
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-label-left  { font-size: 22px; }
  .bar-label-right { font-size: 13px; font-weight: 500; min-width: 36px; text-align: right; }
  .bar-girl .bar-label-right { color: var(--pink); }
  .bar-boy  .bar-label-right { color: var(--blue); }

  .bar-track {
    flex: 1;
    height: 10px;
    border-radius: 10px;
    background: #f0edf4;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 10px;
    width: 0%;
    transition: width 0.8s cubic-bezier(0.34,1.2,0.64,1);
  }
  .bar-fill-girl { background: linear-gradient(90deg, var(--pink-mid), var(--pink)); }
  .bar-fill-boy  { background: linear-gradient(90deg, var(--blue-mid), var(--blue)); }

  .total-count {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 1.2rem;
    letter-spacing: 1px;
  }
  .total-count span { font-weight: 500; color: var(--dark); }

  /* ── VOTED MESSAGE ── */
  .voted-badge {
    display: none;
    text-align: center;
    margin-bottom: 1.5rem;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    font-style: italic;
    color: var(--gold);
  }
  .voted-badge.show { display: block; animation: fadeDown 0.5s ease; }

  /* ── NAMES WALL ── */
  .names-section {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto 4rem;
    padding: 0 1.5rem;
    opacity: 0;
    animation: fadeDown 0.9s ease forwards 1.4s;
  }

  .names-title {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    font-weight: 300;
    color: var(--text-muted);
    margin-bottom: 1.2rem;
    letter-spacing: 1px;
  }

  .name-input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 1.2rem;
  }
  .name-input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1.5px solid rgba(0,0,0,0.1);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    background: white;
    color: var(--dark);
    outline: none;
    transition: border-color 0.2s;
  }
  .name-input:focus { border-color: var(--gold); }
  .name-submit {
    padding: 12px 20px;
    border-radius: 12px;
    border: none;
    background: var(--dark);
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity 0.2s, transform 0.15s;
  }
  .name-submit:hover { opacity: 0.85; }
  .name-submit:active { transform: scale(0.97); }

  .names-wall {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 50px;
  }

  .name-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 400;
    animation: popIn 0.4s cubic-bezier(0.34,1.4,0.64,1);
  }
  .chip-girl { background: var(--pink-light); color: var(--pink); border: 1px solid rgba(232,88,122,0.2); }
  .chip-boy  { background: var(--blue-light); color: var(--blue); border: 1px solid rgba(77,131,213,0.2); }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* ── FOOTER ── */
  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem 1.5rem 3rem;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }
  footer strong { color: var(--gold); font-weight: 400; }

  /* ── CONFETTI BURST ── */
  .confetti-piece {
    position: fixed;
    width: 10px; height: 10px;
    pointer-events: none;
    z-index: 999;
    animation: confettiFall 1.6s ease-out forwards;
  }
  @keyframes confettiFall {
    0%   { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translateY(200px) rotate(720deg) scale(0.3); }
  }
</style>
</head>
<body>

<div id="particles"></div>

<!-- HERO -->
<section class="hero">
  <p class="hero-eyebrow">Gender Reveal Party</p>
  <h1 class="hero-title">Мальчик или <em>Девочка?</em></h1>
  <p class="hero-sub">Проголосуйте и узнайте, кто победит</p>
  <div class="ornament">
    <div class="ornament-line"></div>
    <div class="ornament-diamond"></div>
    <div class="ornament-diamond" style="width:4px;height:4px;opacity:0.5"></div>
    <div class="ornament-diamond"></div>
    <div class="ornament-line r"></div>
  </div>
</section>

<!-- VOTE CARDS -->
<section class="vote-section">
  <div class="vote-card card-girl" id="cardGirl" onclick="vote('girl')">
    <span class="card-icon">🌸</span>
    <span class="card-label">Девочка</span>
    <p class="card-sub">Princess</p>
    <button class="vote-btn" onclick="vote('girl'); event.stopPropagation()">Голосовать</button>
  </div>
  <div class="vote-card card-boy" id="cardBoy" onclick="vote('boy')">
    <span class="card-icon">⚡</span>
    <span class="card-label">Мальчик</span>
    <p class="card-sub">Prince</p>
    <button class="vote-btn" onclick="vote('boy'); event.stopPropagation()">Голосовать</button>
  </div>
</section>

<!-- RESULTS -->
<section class="results-section">
  <p class="results-title">— Результаты голосования —</p>
  <p class="voted-badge" id="votedBadge">✦ Ваш голос учтён, спасибо! ✦</p>
  <div class="results-bar-wrap">
    <div class="bar-row bar-girl">
      <span class="bar-label-left">🌸</span>
      <div class="bar-track"><div class="bar-fill bar-fill-girl" id="barGirl"></div></div>
      <span class="bar-label-right" id="pctGirl">0%</span>
    </div>
    <div class="bar-row bar-boy">
      <span class="bar-label-left">⚡</span>
      <div class="bar-track"><div class="bar-fill bar-fill-boy" id="barBoy"></div></div>
      <span class="bar-label-right" id="pctBoy">0%</span>
    </div>
  </div>
  <p class="total-count">Всего голосов: <span id="totalVotes">0</span></p>
</section>

<!-- NAMES WALL -->
<section class="names-section">
  <p class="names-title">— Кто уже проголосовал —</p>
  <div class="name-input-row">
    <input class="name-input" id="nameInput" placeholder="Ваше имя..." maxlength="30" />
    <button class="name-submit" onclick="submitName()">Добавить</button>
  </div>
  <div class="names-wall" id="namesWall"></div>
</section>

<footer>
  <p>С любовью и нетерпением ✦ <strong>Gender Reveal 2025</strong></p>
</footer>

<script>
// ── STATE ──
const STATE_KEY = 'genderReveal_v1';
let state = { girlVotes: 0, boyVotes: 0, names: [], myVote: null };

function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (raw) state = { ...state, ...JSON.parse(raw) };
  } catch(e) {}
}

function saveState() {
  try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch(e) {}
}

// ── PARTICLES ──
function createParticles() {
  const wrap = document.getElementById('particles');
  const colors = ['#f4a8bc','#95b8ea','#c9a96e','#f0d4e2','#d4e4f7'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const sz = Math.random() * 8 + 4;
    p.style.cssText = `
      width:${sz}px; height:${sz}px;
      left:${Math.random()*100}%;
      bottom:-${sz}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${8 + Math.random()*10}s;
      animation-delay:${Math.random()*8}s;
    `;
    wrap.appendChild(p);
  }
}

// ── VOTE ──
function vote(choice) {
  if (state.myVote) {
    // already voted — just animate card
    const card = choice === 'girl' ? document.getElementById('cardGirl') : document.getElementById('cardBoy');
    card.style.transform = 'scale(0.95)';
    setTimeout(() => card.style.transform = '', 150);
    return;
  }

  state.myVote = choice;
  if (choice === 'girl') state.girlVotes++;
  else state.boyVotes++;
  saveState();

  burstConfetti(choice);
  renderResults();
  markVoted(choice);
}

function markVoted(choice) {
  document.getElementById('cardGirl').classList.toggle('card-voted-girl', choice === 'girl');
  document.getElementById('cardBoy').classList.toggle('card-voted-boy', choice === 'boy');
  document.getElementById('votedBadge').classList.add('show');
}

// ── RENDER ──
function renderResults() {
  const g = state.girlVotes, b = state.boyVotes, t = g + b;
  const gp = t ? Math.round(g / t * 100) : 0;
  const bp = t ? Math.round(b / t * 100) : 0;

  document.getElementById('barGirl').style.width = gp + '%';
  document.getElementById('barBoy').style.width  = bp + '%';
  document.getElementById('pctGirl').textContent  = gp + '%';
  document.getElementById('pctBoy').textContent   = bp + '%';
  document.getElementById('totalVotes').textContent = t;
}

function renderNames() {
  const wall = document.getElementById('namesWall');
  wall.innerHTML = '';
  state.names.forEach(n => {
    const chip = document.createElement('div');
    chip.className = `name-chip ${n.vote === 'girl' ? 'chip-girl' : 'chip-boy'}`;
    chip.innerHTML = `<span>${n.vote === 'girl' ? '🌸' : '⚡'}</span><span>${escapeHtml(n.name)}</span>`;
    wall.appendChild(chip);
  });
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── NAMES ──
function submitName() {
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if (!name) return;
  if (!state.myVote) { alert('Сначала проголосуйте — нажмите на карточку выше!'); return; }
  if (state.names.some(n => n.name.toLowerCase() === name.toLowerCase())) {
    input.value = ''; return;
  }
  state.names.unshift({ name, vote: state.myVote });
  if (state.names.length > 40) state.names.length = 40;
  saveState();
  renderNames();
  input.value = '';
}

document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitName();
});

// ── CONFETTI ──
function burstConfetti(choice) {
  const colors = choice === 'girl'
    ? ['#e8587a','#f4a8bc','#fff0f5','#c9a96e']
    : ['#4d83d5','#95b8ea','#e4edf9','#c9a96e'];

  for (let i = 0; i < 28; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const sz = Math.random() * 10 + 6;
    const x = window.innerWidth * 0.3 + Math.random() * window.innerWidth * 0.4;
    const y = window.innerHeight * 0.35;
    const dx = (Math.random() - 0.5) * 300;
    el.style.cssText = `
      left:${x}px; top:${y}px;
      width:${sz}px; height:${sz}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      border-radius:${Math.random() > 0.5 ? '50%' : '2px'};
      transform:translate(${dx}px, ${-(Math.random()*120+40)}px);
      animation-delay:${Math.random()*0.3}s;
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }
}

// ── INIT ──
loadState();
createParticles();
renderResults();
renderNames();

if (state.myVote) {
  markVoted(state.myVote);
}

// animate bars on load
setTimeout(renderResults, 200);
</script>
</body>
</html>
